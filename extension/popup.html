<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #333;
      padding: 12px;
    }
    h1 { font-size: 16px; margin-bottom: 8px; }
    .status { color: #666; margin-bottom: 12px; }
    .error { color: #c33; margin: 8px 0; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-onsite { background: #d4edda; color: #155724; }
    .badge-partner { background: #cce5ff; color: #004085; }
    .badge-nearby_only { background: #fff3cd; color: #856404; }
    .badge-unknown { background: #e2e3e5; color: #383d41; }
    .badge-avoid { background: #f8d7da; color: #721c24; }
    .result { margin-top: 8px; }
    .result-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .result-header h2 { font-size: 14px; flex: 1; }
    .summary { line-height: 1.5; margin: 6px 0; }
    .section-title { font-size: 12px; font-weight: 600; color: #555; margin: 8px 0 4px; }
    ul { list-style: none; }
    ul li { padding: 3px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
    .evidence-source { color: #999; font-size: 10px; margin-right: 2px; }
    .parking-item { display: flex; justify-content: space-between; }
    .parking-dist { color: #666; }
    .actions { margin-top: 10px; display: flex; gap: 6px; }
    .actions button, .actions a {
      padding: 5px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f8f8f8;
      cursor: pointer;
      text-decoration: none;
      color: #333;
      font-size: 12px;
    }
    .actions button:hover, .actions a:hover { background: #e8e8e8; }
    #analyze-btn {
      width: 100%;
      padding: 8px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    #analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #analyze-btn:hover:not(:disabled) { background: #3a7bc8; }
  </style>
</head>
<body>
  <h1>Parking Judge</h1>
  <div id="status" class="status">Google Mapsのページ情報を取得中...</div>
  <div id="place-info"></div>
  <button id="analyze-btn" style="display:none">駐車場を判定</button>
  <div id="error" class="error" style="display:none"></div>
  <div id="result" class="result" style="display:none"></div>
  <script src="popup.js"></script>
</body>
</html>
